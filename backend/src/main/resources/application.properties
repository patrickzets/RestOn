spring.application.name=RestON
server.port=8080

# Banco de dados PostgreSQL.
# Os valores padrão servem para o banco do docker-compose.yml (só para desenvolvimento).
# Em produção, defina as variáveis de ambiente RESTON_DB_*.
spring.datasource.url=jdbc:postgresql://${RESTON_DB_HOST:localhost}:${RESTON_DB_PORT:5432}/${RESTON_DB_NOME:reston}
spring.datasource.username=${RESTON_DB_USUARIO:reston}
spring.datasource.password=${RESTON_DB_SENHA:reston_dev}

# O Flyway cria e altera as tabelas (arquivos em db/migration).
# O Hibernate só confere se as entidades batem com as tabelas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Só expõe o que precisamos do Actuator
management.endpoints.web.exposure.include=health,info

# Documentação da API: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Sessão de login: cookie HttpOnly (o JavaScript não lê) e SameSite=Strict.
# Em produção, com HTTPS, defina RESTON_COOKIE_SEGURO=true.
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=RESTON_SESSAO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${RESTON_COOKIE_SEGURO:false}

# Primeiro administrador (criado só se o banco estiver sem funcionários).
# Sem RESTON_ADMIN_SENHA, o sistema gera uma senha provisória e mostra no log.
reston.admin.login=${RESTON_ADMIN_LOGIN:admin}
reston.admin.senha=${RESTON_ADMIN_SENHA:}

# Fotos dos produtos (em produção, aponte para uma pasta que sobreviva a novas versões, como um volume do Docker)
reston.upload.diretorio=${RESTON_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Dados de demonstração (opcional, desligado por padrão). Só use em máquina de desenvolvimento.
reston.demo.ativo=${RESTON_DEMO_ATIVO:false}
