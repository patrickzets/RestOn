# Banco de dados de desenvolvimento do RestON.
# Subir:    docker compose up -d
# Parar:    docker compose down          (os dados ficam guardados no volume)
# Apagar tudo (inclusive os dados): docker compose down -v
name: reston

services:
  banco:
    image: postgres:17
    container_name: reston-banco
    environment:
      POSTGRES_DB: ${RESTON_DB_NOME:-reston}
      POSTGRES_USER: ${RESTON_DB_USUARIO:-reston}
      POSTGRES_PASSWORD: ${RESTON_DB_SENHA:-reston_dev}
      TZ: America/Sao_Paulo
    ports:
      - "${RESTON_DB_PORT:-5432}:5432"
    volumes:
      - banco-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESTON_DB_USUARIO:-reston} -d ${RESTON_DB_NOME:-reston}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  banco-dados:
